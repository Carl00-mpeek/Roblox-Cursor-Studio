name: Derle ve yayınla
# Windows sunucusunda uygulamayı derler, testleri çalıştırır; taşınabilir exe ve Setup (kurulum) üretir.
#  1) "v" ile başlayan bir tag push'layınca (örn. v5.1.0) iki exe de bir GitHub Release'e eklenir.
#     Tag, RBXCursorStudio.csproj içindeki <Version> ile başlamalı (v5.1.0 <-> 5.1.0);
#     sonuna _hotfix, -beta gibi ek gelebilir.
#     Örnek:  git tag v5.1.0 && git push origin v5.1.0
#  2) Actions sekmesinden "Run workflow" ile elle de çalışır; çıktı Artifacts olarak indirilir.
#  3) Dallara push'larda ve PR'larda yalnızca derleme + test yapılır (exe yine Artifacts'ta).
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kodu indir
        uses: actions/checkout@v6
      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Node.js kur (paket biçimi uyumluluk testleri için)
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sürümü oku ve tag ile karşılaştır
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content RBXCursorStudio/RBXCursorStudio.csproj
          $v = ($p.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          Write-Host "Sürüm: $v"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $pattern = '^v' + [regex]::Escape($v) + '($|[_+-])'
            if ($env:GITHUB_REF_NAME -notmatch $pattern) { throw "Tag ($env:GITHUB_REF_NAME) csproj sürümüyle ($v) uyuşmuyor." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Testler
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP 'fixtures'
          node CoreTests/fixtures-tools/make-fixtures.js . $fx
          if ($LASTEXITCODE -ne 0) { throw 'Test girdileri üretilemedi' }
          dotnet run --project CoreTests -c Release -- $fx
          if ($LASTEXITCODE -ne 0) { throw 'C# testleri başarısız' }
          node CoreTests/fixtures-tools/verify-cs-output.js . $fx
          if ($LASTEXITCODE -ne 0) { throw 'Uyumluluk testleri başarısız' }
      - name: Derle
        run: dotnet build RBXCursorStudio/RBXCursorStudio.csproj -c Release
      - name: Exe'yi hazırla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # Ad, uygulamanın güncelleme denetleyicisinin aradığı biçimle aynı ("... Portable <sürüm>.exe")
          Copy-Item RBXCursorStudio/bin/Release/net48/RBXCursorStudio.exe "out/RBX Cursor Studio Portable ${{ steps.ver.outputs.version }}.exe"
      - name: Setup (kurulum) dosyasını derle
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Host
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=..\RBXCursorStudio\bin\Release\net48\RBXCursorStudio.exe" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Setup derlenemedi' }
          Copy-Item "installer/Output/RBX Cursor Studio Setup ${{ steps.ver.outputs.version }}.exe" out/
      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: RBX-Cursor-Studio-${{ steps.ver.outputs.version }}
          path: out/*.exe
      - name: GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
